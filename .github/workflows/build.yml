name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 and Install Qt6
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base

      - name: Configure and Build
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Collect Dependencies
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/SteamClone.exe dist/
          windeployqt --release --no-translations dist/SteamClone.exe

          # Сбор всех связанных системных dll
          for i in 1 2 3; do
            find dist/ -type f \( -name "*.exe" -o -name "*.dll" \) -exec ldd {} + 2>/dev/null \
              | grep "/ucrt64/bin" \
              | awk '{print $3}' \
              | sort -u \
              | while read -r lib; do
                  if [ -f "$lib" ]; then
                    cp -u "$lib" dist/
                  fi
                done
          done

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamClone-Windows-x64
          path: dist/
