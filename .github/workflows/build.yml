name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          arch: 'win64_msvc2019_64'
          modules: 'qtbase'

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Collect Dependencies (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Release\SteamClone.exe dist\
          # Запуск утилиты windeployqt для копирования необходимых Qt DLL
          windeployqt --release --no-translations dist\SteamClone.exe

      - name: Upload Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteamClone-Windows-x64
          path: dist/
